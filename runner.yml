- name: Runner Setup
  hosts: all
  become: yes

  tasks:

    - name: Install requests
      ansible.builtin.pip:
        name: requests

    - name: Pull GitHub Runner image
      containers.podman.podman_image:
        name: docker.io/rkalluru/github-runner:d87
        pull: true

    - name: Runner container
      containers.podman.podman_container:
        name: "{{ item }}"
        image: docker.io/rkalluru/github-runner:d87
        state: started
        recreate: true
        restart_policy: always
        security_opt:
          - label=disable
        volumes:
          - /run/podman/podman.sock:/var/run/docker.sock
        env:
          NAME: "{{ item }}"
          TOKEN: "{{ TOKEN }}"
          ORG: "https://github.com/sdevops5427"
      loop:
        - runner1
        - runner2
        - runner3
        - runner4
        - runner5
        - runner6
      register: out
      ignore_errors: yes

    - name: Run from Scratch
      when: out.failed is defined and out.failed
      block:

        - name: Download Docker repo
          ansible.builtin.get_url:
            url: https://download.docker.com/linux/rhel/docker-ce.repo
            dest: /etc/yum.repos.d/docker.repo

        - name: Install Docker
          ansible.builtin.dnf:
            name: docker-ce
            state: present

        - name: Start Docker
          ansible.builtin.systemd_service:
            name: docker
            state: started
            enabled: yes
            daemon_reload: yes

        - name: Add github runner user
          ansible.builtin.user:
            name: github-runner
            home: /github-runner
            groups: docker
            append: yes

        - name: Pull GitHub Runner image
          containers.podman.podman_image:
            name: docker.io/rkalluru/github-runner:d87
            pull: true

        - name: Runner container
          containers.podman.podman_container:
            name: "{{ item }}"
            image: docker.io/rkalluru/github-runner:d87
            state: started
            recreate: true
            restart_policy: always
            volumes:
              - /run/podman/podman.sock:/var/run/docker.sock
            env:
              NAME: "{{ item }}"
              TOKEN: "{{ TOKEN }}"
              ORG: "https://github.com/sdevops5427"
          loop:
            - runner1
            - runner2
            - runner3
            - runner4
            - runner5
            - runner6

        - name: Give write permission to docker socket
          ansible.builtin.file:
            path: /var/run/docker.sock
            mode: "0666"